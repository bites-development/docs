apiVersion: v1
kind: Service
metadata:
  name: {{ include "bites-docs.fullname" . }}-service
  labels:
    {{- include "bites-docs.labels" . | nindent 4 }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "bites-docs.selectorLabels" . | nindent 4 }}
